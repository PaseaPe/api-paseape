# ==============================================================================
# 1. CARGA NATIVA DE VARIABLES DE ENTORNO (.env)
# ==============================================================================
spring.config.import=optional:file:.env[.properties]

# ==============================================================================
# 2. SERVIDOR EMBEBIDO (Puerto 7001 - PaseaPe Backend)
# ==============================================================================
server.port=${SERVER_PORT:7001}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api-paseape}

# ==============================================================================
# 3. DATASOURCE (Compatible Local XAMPP y Aiven MySQL Cloud)
# ==============================================================================
spring.datasource.url=jdbc:mysql://${DATASOURCE_HOST:localhost}:${DATASOURCE_PORT:3306}/${DATASOURCE_DATABASE:paseape_db}?createDatabaseIfNotExist=true&sslMode=${DATASOURCE_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&connectionTimeZone=America/Lima&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DATASOURCE_USERNAME:root}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de Conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=${MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=PaseaPeHikariPool

# ==============================================================================
# 4. JPA / HIBERNATE (Garantía de Zona Horaria de Lima y Soft Delete)
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# SQL Logging
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# 5. CONTROL DE VERSIONES DEL ESQUEMA (Flyway)
# ==============================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ==============================================================================
# 6. SEGURIDAD & OAUTH (Google Identity y JJWT - Namespaces Alineados)
# ==============================================================================
app.security.google-client-id=${GOOGLE_CLIENT_ID:tu-web-client-id.apps.googleusercontent.com}
app.security.jwt-secret=${JWT_SECRET:super_secret_key_paseape_lima_2026_development_token_hash_256bits_min_32_bytes}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# MASTER SWITCH DE TAREAS PROGRAMADAS
# ==============================================================================
app.scheduling.enabled=true

# ==============================================================================
# INTERVALOS DE EJECUCI�N (EXPUESTOS PARA PROD / OCI)
# ==============================================================================
# Heartbeat Aiven: 14400000 ms = 4 horas
app.scheduler.heartbeat.initial-delay-ms=30000
app.scheduler.heartbeat.interval-ms=14400000

# Limpieza y reglas de negocio: Medianoche en Lima (UTC-5)
app.scheduler.paseos.expiracion-cron=0 0 0 * * *