name: CI/CD Production Pipeline - PaseaPe API

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Compilacion y Despliegue Continuo (OCI Multi-Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Compilar artefacto Spring Boot JAR (Entorno UTC)
        env:
          JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
          TZ: "UTC"
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x jar --no-daemon -x test

      - name: Validar empaquetado de migraciones Flyway
        run: |
          echo "=== Verificando scripts SQL en el JAR ==="
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          echo "Inspeccionando: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -E "BOOT-INF/classes/db/migration/.*\.sql" || {
            echo "ERROR CRITICO: No se encontraron scripts de migracion SQL dentro del JAR compilado."
            exit 1
          }

      - name: Preparar artefacto y llave OCI (si existe secret)
        id: prep
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          cp "$JAR_FILE" build/app.jar.deploy
          if [ -n "$OCI_API_KEY" ]; then
            printf '%s\n' "$OCI_API_KEY" > build/oci_api_key.pem
            chmod 600 build/oci_api_key.pem
            echo "has_oci_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_oci_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Transferir JAR a OCI via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/app.jar.deploy"
          target: "/home/ubuntu/paseape"
          strip_components: 1

      - name: Transferir llave OCI via SCP (si existe secret)
        if: steps.prep.outputs.has_oci_key == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/oci_api_key.pem"
          target: "/home/ubuntu/paseape"
          strip_components: 1

      - name: Apagado forzado, purga de JARs viejos y arranque determinista en UTC
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/paseape

            echo "=== 1. Deteniendo contenedores forzadamente ==="
            docker compose down --timeout 5 || true

            echo "=== 2. Validando llegada del nuevo artefacto ==="
            if [ ! -f app.jar.deploy ]; then
              echo "ERROR CRITICO: app.jar.deploy no llego al servidor. Abortando despliegue."
              exit 1
            fi

            echo "=== 3. Purgando archivos JAR anteriores ==="
            find . -maxdepth 1 -name "*.jar*" ! -name "app.jar.deploy" -type f -exec rm -vf {} +

            echo "=== 4. Asignando el nuevo binario y validando llave OCI ==="
            mv -f app.jar.deploy app.jar
            chmod 644 app.jar
            if [ ! -f oci_api_key.pem ]; then
              echo "ERROR CRITICO: oci_api_key.pem no existe en /home/ubuntu/paseape."
              exit 1
            fi
            chmod 644 oci_api_key.pem
            ls -lh app.jar oci_api_key.pem

            echo "=== 5. Sincronizando variables en .env remoto ==="
            if [ -f .env ]; then
              sed -i 's/^TZ=.*/TZ=UTC/' .env
              sed -i 's/^JAVA_TOOL_OPTIONS=.*/JAVA_TOOL_OPTIONS=-Duser.timezone=UTC/' .env
              grep -q "^TZ=" .env || echo "TZ=UTC" >> .env
            else
              echo "TZ=UTC" > .env
              echo "JAVA_TOOL_OPTIONS=-Duser.timezone=UTC" >> .env
            fi

            echo "=== 6. Levantando servicio con Docker Compose ==="
            docker compose up -d --force-recreate --remove-orphans

            echo "=== 7. Registro de arranque del contenedor ==="
            sleep 5
            docker compose logs --tail=40

      - name: Smoke Test (Healthcheck en Vivo con reintentos nativos)
        run: |
          echo "Ejecutando verificacion de disponibilidad en produccion..."
          curl --fail \
               --retry 20 \
               --retry-delay 3 \
               --retry-connrefused \
               --silent \
               --show-error \
               "http://${{ secrets.OCI_HOST }}:7001/api-paseape/health"
          echo "Servicio PaseaPe API desplegado y respondiendo HTTP 200 OK."