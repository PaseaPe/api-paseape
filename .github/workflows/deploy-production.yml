name: CI/CD Production Pipeline - PaseaPe API

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Compilacion y Despliegue Continuo (OCI Multi-Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Compilar artefacto Spring Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x jar --no-daemon -x test

      - name: Validar empaquetado de migraciones Flyway
        run: |
          echo "=== Verificando scripts SQL en el JAR ==="
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          echo "Inspeccionando: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -E "BOOT-INF/classes/db/migration/.*\.sql" || {
            echo "ERROR CRITICO: No se encontraron scripts de migracion SQL dentro del JAR compilado."
            exit 1
          }

      - name: Preparar artefacto para despliegue
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          cp "$JAR_FILE" build/app.jar.deploy

      - name: Transferir JAR a OCI via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/app.jar.deploy"
          target: "/home/ubuntu/paseape"
          strip_components: 1

      - name: Apagado forzado, purga de JARs viejos y arranque
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/paseape

            echo "=== 1. Deteniendo contenedores forzadamente ==="
            docker compose down --timeout 5 || true

            echo "=== 2. Validando llegada del nuevo artefacto ==="
            if [ ! -f app.jar.deploy ]; then
              echo "ERROR CRITICO: app.jar.deploy no llego al servidor. Abortando despliegue."
              exit 1
            fi

            echo "=== 3. Purgando todos los archivos JAR anteriores ==="
            # Elimina cualquier .jar existente excepto el archivo que se acaba de transferir
            find . -maxdepth 1 -name "*.jar*" ! -name "app.jar.deploy" -type f -exec rm -vf {} +

            echo "=== 4. Asignando el nuevo binario a app.jar ==="
            mv -f app.jar.deploy app.jar
            chmod 644 app.jar
            ls -lh app.jar

            echo "=== 5. Levantando servicio con Docker Compose en UTC ==="
            export TZ=UTC
            export JAVA_TOOL_OPTIONS="-Duser.timezone=UTC"
            docker compose up -d --force-recreate --remove-orphans

            echo "=== 6. Registro de arranque del contenedor ==="
            sleep 4
            docker compose logs --tail=30

      - name: Smoke Test (Healthcheck en Vivo con reintentos nativos)
        run: |
          echo "Ejecutando verificacion de disponibilidad en produccion..."
          curl --fail \
               --retry 20 \
               --retry-delay 3 \
               --retry-connrefused \
               --silent \
               --show-error \
               "http://${{ secrets.OCI_HOST }}:7001/api-paseape/health"
          echo "Servicio PaseaPe API desplegado y respondiendo HTTP 200 OK."