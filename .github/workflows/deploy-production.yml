name: CI/CD Production Pipeline - PaseaPe API

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Compilacion y Despliegue Continuo (OCI Multi-Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Compilar artefacto Spring Boot JAR
        run: |
          chmod +x ./gradlew
          # Limpia build anterior y evita generar el -plain.jar (-x jar)
          ./gradlew clean bootJar -x jar --no-daemon -x test

      - name: Validar empaquetado de migraciones Flyway
        run: |
          echo "=== Verificando scripts SQL en el JAR ==="
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          echo "Inspeccionando: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -E "BOOT-INF/classes/db/migration/.*\.sql" || {
            echo "ERROR CRITICO: No se encontraron scripts de migracion SQL dentro del JAR compilado."
            exit 1
          }

      - name: Preparar artefacto para despliegue
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          # Renombrar localmente a un nombre temporal predecible
          cp "$JAR_FILE" build/libs/app.jar.new

      - name: Transferir JAR a OCI via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/libs/app.jar.new"
          target: "/home/ubuntu/paseape"
          strip_components: 2

      - name: Actualizar app.jar y reiniciar contenedor Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/paseape

            # Reemplazo atomico del archivo viejo por el nuevo
            if [ -f app.jar.new ]; then
              mv -f app.jar.new app.jar
              echo "app.jar actualizado exitosamente con la nueva version."
            else
              echo "Error: No se recibio app.jar.new en el servidor."
              exit 1
            fi

            # Inyectar TZ y JAVA_TOOL_OPTIONS (-Duser.timezone=UTC) al reiniciar el contenedor
            TZ=UTC JAVA_TOOL_OPTIONS="-Duser.timezone=UTC" docker compose up -d --force-recreate --remove-orphans

      - name: Smoke Test (Healthcheck en Vivo con reintentos nativos)
        run: |
          echo "Ejecutando verificacion de disponibilidad en produccion..."
          curl --fail \
               --retry 20 \
               --retry-delay 3 \
               --retry-connrefused \
               --silent \
               --show-error \
               "http://${{ secrets.OCI_HOST }}:7001/api-paseape/health"
          echo "Servicio PaseaPe API desplegado y respondiendo HTTP 200 OK."