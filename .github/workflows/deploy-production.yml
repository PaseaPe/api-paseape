name: CI/CD Production Pipeline - PaseaPe API

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    name: Compilacion y Despliegue Continuo (OCI Multi-Arch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Compilar artefacto Spring Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar --no-daemon -x test

      - name: Transferir JAR a OCI via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/paseape"
          strip_components: 2

      - name: Actualizar app.jar y reiniciar contenedor Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /home/ubuntu/paseape
            # Renombrar el artefacto recibido al nombre estandar montado por compose
            mv -f *.jar app.jar

            # Recrear el contenedor con cero tiempo muerto de red
            docker compose up -d --force-recreate --remove-orphans

      - name: Smoke Test (Healthcheck en Vivo con reintentos nativos)
        run: |
          echo "Ejecutando verificacion de disponibilidad en produccion..."
          # Reintenta cada 3 segundos hasta por 60 segundos buscando HTTP 200
          curl --fail \
               --retry 20 \
               --retry-delay 3 \
               --retry-connrefused \
               --silent \
               --show-error \
               "http://${{ secrets.OCI_HOST }}:7001/api-paseape/health"
          echo "Servicio PaseaPe API desplegado y respondiendo HTTP 200 OK."
