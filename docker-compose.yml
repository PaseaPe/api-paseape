services:
  mysql-db:
    image: mysql:8.0
    container_name: paseape-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --explicit_defaults_for_timestamp=true
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paseape_db
    ports:
      - "3306:3306"
    volumes:
      - paseape_mysql_data:/var/lib/mysql

volumes:
  paseape_mysql_data: